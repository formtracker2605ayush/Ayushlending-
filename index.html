<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayush Tasks</title>
    <style>
        body {
            background-color: #0b0712;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .ticker {
            display: flex;
            justify-content: space-around;
            background-color: #150a21;
            padding: 8px;
            font-size: 12px;
            color: #b288ff;
            margin-bottom: 20px;
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }
        .title span {
            color: #9d4edd;
        }
        .subtitle {
            font-size: 12px;
            color: #aaa;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .price {
            color: #ff3333;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-telegram {
            display: block;
            background: linear-gradient(90deg, #7b2cbf, #9d4edd);
            color: white;
            padding: 15px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            margin: 0 auto 25px auto;
            max-width: 350px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 380px;
            margin: 0 auto 30px auto;
        }
        .card {
            background-color: #161024;
            border: 1px solid #2a1f3d;
            border-radius: 12px;
            padding: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .footer-text {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
        .footer-text span {
            color: #9d4edd;
        }
    </style>
</head>
<body>

    <div class="ticker">
        <span>NIFTY 50 ▲ 0.62%</span>
        <span>SENSEX 81,240 ▼ 0.14%</span>
        <span>BANKNIFTY 53,190</span>
    </div>

    <div class="title">AYUSH <span>TASKS</span></div>
    <div class="subtitle">WITHOUT INVESTMENT WORK</div>

    <div class="status-badge">• CHANNEL ACTIVE NOW</div>

    <div class="price">1 Tasks = 500 Rupees</div>

    <!-- अपना टेलीग्राम लिंक href में डालें -->
    <a href="https://t.me/your_channel_link" class="btn-telegram">🚀 JOIN TELEGRAM CHANNEL</a>

    <div class="grid">
        <div class="card">💰<br><br>WITHOUT INVESTMENT</div>
        <div class="card">📋<br><br>DAILY TASK</div>
        <div class="card">⚡<br><br>INSTANT SETUP</div>
        <div class="card">🔐<br><br>VERIFIED CHANNEL</div>
    </div>

    <div class="footer-text">
        START EARNING <span>WITHOUT ANY INVESTMENT</span><br>
        <small>— JOIN NOW</small>
    </div>

</body>
</html>
